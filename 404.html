<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 – Page Not Found | ChandraJyoti Construction and Suppliers Pvt. Ltd.</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to ChandraJyoti Construction and Suppliers Pvt. Ltd. homepage.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/CCSPL LOGO.png">
    <link rel="shortcut icon" type="image/png" href="assets/CCSPL LOGO.png">
    <link rel="apple-touch-icon" href="assets/CCSPL LOGO.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B2A4A;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* ── Card ── */
        .card {
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        /* ── Logo ── */
        .logo {
            display: block;
            height: 72px;
            width: auto;
            margin: 0 auto 3rem;
        }

        /* ── 404 number ── */
        .error-number {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(6rem, 20vw, 9rem);
            font-weight: 900;
            color: #F5811F;
            line-height: 1;
            margin-bottom: 1.25rem;
            letter-spacing: -2px;
        }

        /* ── Heading ── */
        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.25rem, 3.5vw, 1.75rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        /* ── Divider ── */
        .divider {
            width: 56px;
            height: 3px;
            background-color: #F5811F;
            border-radius: 99px;
            margin: 0 auto 1.25rem;
        }

        /* ── Description ── */
        .error-desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.75;
            margin-bottom: 2.5rem;
        }

        /* ── Button ── */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #F5811F;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            padding: 0.85rem 2.25rem;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-home:hover {
            background-color: #e0701a;
            transform: translateY(-2px);
        }

        .btn-home svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ── Footer note ── */
        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Logo -->
        <img
            src="assets/CCSPL LOGO.png"
            alt="ChandraJyoti Construction and Suppliers Pvt. Ltd."
            class="logo"
        />

        <!-- 404 -->
        <div class="error-number">404</div>

        <!-- Title -->
        <h1 class="error-title">Oops! The page you're looking for doesn't exist.</h1>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Description -->
        <p class="error-desc">
            The page may have been moved, deleted,<br>or the URL may be incorrect.
        </p>

        <!-- CTA -->
        <a href="./" class="btn-home" id="btn-back-home">
            <!-- Arrow left icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Back to Homepage
        </a>

        <!-- Footer note -->
        <p class="footer-note">© 2026 ChandraJyoti Construction and Suppliers Pvt. Ltd. All rights reserved.</p>

    </div>

</body>
</html>
